<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Countdown</title>
<link rel="stylesheet" href="/fonts/css2?family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../shell/sdk/ui.css">
<style>
/* a short part (a phone on its side): the Start button already says the time */
@media (max-height: 250px) { #cap { display: none; } .l-form { gap: 8px; padding: 0 2px 2px; } }
</style>
<!--
  Countdown on the Host's phone: only part "time", the Time group of the settings: the quick times (one row of chips, a tap
  starts that countdown), three wheels and Start. Start, Pause, Restart and a minute more are the action tiles in the
  drawer (lamba.json actions, heard by tv.html). A start goes to the screen as { type: "cmd", c: { id, op: "start", ms } };
  what runs comes back in Lamba.store "run".
-->
</head>
<body>
<div class="l-form" id="custom" hidden><div class="l-chips" id="chips" role="group" aria-label="Start a countdown"></div><p class="l-cap" id="cap"></p></div>
<p class="l-note" id="note" role="status" hidden></p>
<script src="../../shell/sdk/lamba.js"></script>
<script src="../../shell/sdk/ui.js"></script>
<script src="timer.js"></script>
<script>
(function () {
  "use strict";
  Lamba.ready(function (L) {
    var T = LambaTimer("countdown"), RUN = T.RUN, $ = function (id) { return document.getElementById(id); };
    var run = RUN.clean(L.store.get("run"));
    var ICON = { play: '<path d="M8.5 5.6v12.8l10-6.4z" fill="currentColor" stroke="none"/>' };
    var onTv = function () { var s = L.status; return s.onScreen && s.power !== false && s.tv !== false; };
    var noteT = 0;
    var say = function (t) { var n = $("note"); n.textContent = t; n.hidden = !t; clearTimeout(noteT); if (t) noteT = setTimeout(function () { n.hidden = true; }, 5000); };
    // a start: straight to the screen; the copy follows the screen's own write
    function start(ms) {
      if (!onTv()) { L.show(); return false; }
      if (!L.status.connected) { say("Not sent: the link to your screen is down. It reconnects by itself, try again in a moment."); return false; }
      L.send({ type: "cmd", c: { id: T.rid(), op: "start", ms: ms } }); LambaUI.buzz(); return true;
    }
    L.store.on(function (k, v) { if (k === "run" && v) run = RUN.clean(v); });
    if (L.screen.view !== "part") return;

    // ---- the Time group: the quick times, then three wheels (hours, minutes, seconds) and Start ----
    $("custom").hidden = false;
    var PRESETS = [[60000, "1 min"], [180000, "3 min"], [300000, "5 min"], [600000, "10 min"], [900000, "15 min"], [1800000, "30 min"], [3600000, "1 hour"]];
    $("chips").innerHTML = PRESETS.map(function (p) { return '<button type="button" class="l-chip" data-ms="' + p[0] + '" aria-pressed="' + (p[0] === run.dur) + '">' + p[1] + "</button>"; }).join("");
    $("chips").addEventListener("click", function (e) { var b = e.target.closest("[data-ms]"); if (!b) return; T.Sound.wake(); if (start(+b.getAttribute("data-ms"))) L.open(""); });
    var range = function (n, f) { var a = []; for (var i = 0; i < n; i++) a.push(f ? f(i) : String(i)); return a; };
    var w = LambaUI.wheel([{ label: "Hours", unit: "h", items: range(24) }, { label: "Minutes", unit: "min", items: range(60, T.two) }, { label: "Seconds", unit: "s", items: range(60, T.two) }]);
    $("custom").appendChild(w.el);
    var go = document.createElement("button"); go.type = "button"; go.className = "l-btn light l-wide"; go.innerHTML = LambaUI.svg(ICON.play) + "<span>Start</span>"; $("custom").appendChild(go);
    var ms = function () { var v = w.get(); return ((v[0] * 60 + v[1]) * 60 + v[2]) * 1000; };
    var show = function () { var m = ms(); $("cap").textContent = m ? T.durWords(m) : "Pick a time"; go.disabled = !m; go.lastChild.textContent = m ? "Start " + T.fmtCD(m) : "Start"; };
    w.onChange = show;
    go.addEventListener("click", function () { var m = ms(); if (!m) return; T.Sound.wake(); if (start(m)) L.open(""); });
    var t = Math.round(run.dur / 1000); w.set([Math.min(23, Math.floor(t / 3600)), Math.floor(t / 60) % 60, t % 60]); show();
  });
})();
</script>
</body>
</html>
