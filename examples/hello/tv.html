<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello</title>
<link rel="stylesheet" href="/fonts/css2?family=Figtree:wght@500;700&display=swap">
<!--
  Hello, the smallest SDK app (docs/sdk/README.md): the example to copy. The screen says hello; Players who join wave from
  their phones ({ type: "wave" }), the Host waves with the Wave tile (lamba.json actions: { type: "action", key: "wave" }),
  the screen shows each wave and waves back to that Player ({ type: "seen" }). It counts every wave in Lamba.store
  "waves". Four play; up to 20 more wave as visitors (lamba.json visitors: Lamba.visitors).
  Settings (lamba.json): bg, names. Old screen browsers (Chrome 61): ES5 only.
-->
<style>
html, body { margin: 0; height: 100%; overflow: hidden; font-family: Figtree, sans-serif; }
body { display: -webkit-box; display: flex; -webkit-box-align: center; align-items: center; -webkit-box-pack: center; justify-content: center; text-align: center; transition: background-color .6s ease; }
h1 { margin: 0; font-size: 14vh; font-weight: 700; letter-spacing: -.02em; }
p { margin: 3vh 0 0; font-size: 4vh; opacity: .75; }
.tall h1 { font-size: 10vh; } .tall p { font-size: 3.4vh; padding: 0 6vw; }   /* one half of a split screen, its own tall shape (lamba.json "split": "tall") */
.wave { display: inline-block; width: .8em; height: .8em; vertical-align: -.06em; -webkit-transform-origin: 70% 90%; transform-origin: 70% 90%; -webkit-animation: wave .9s ease; animation: wave .9s ease; }
@-webkit-keyframes wave { 30% { -webkit-transform: rotate(18deg); } 60% { -webkit-transform: rotate(-12deg); } }
@keyframes wave { 30% { transform: rotate(18deg); } 60% { transform: rotate(-12deg); } }
</style>
</head>
<body>
<div id="words"><h1 id="hi">Hello</h1><p id="line"></p></div>
<script src="../../shell/sdk/lamba.js"></script>
<script>
(function () {
  "use strict";
  var LOOK = { sea: ["#123c46", "#e6fbf4"], sun: ["#ffcf5c", "#2b1d05"], night: ["#0d0d12", "#f2f2f6"] };
  Lamba.ready(function (L) {
    var hi = document.getElementById("hi"), line = document.getElementById("line");
    var paint = function () { var c = LOOK[L.settings.bg] || LOOK.sea; document.body.style.background = c[0]; document.body.style.color = c[1]; L.colours({ board: c[0], ink: c[1] }); };
    var count = function () { var n = L.store.get("waves") || 0; line.textContent = n ? n + (n === 1 ? " wave so far" : " waves so far") : "Scan to wave from your phone"; };
    // the join card: big while nobody has joined, beside the words (avoid: where they are, in shares of the screen)
    var words = function () { var r = document.getElementById("words").getBoundingClientRect(), w = innerWidth || 1, h = innerHeight || 1; return [r.left / w, r.top / h, r.right / w, r.bottom / h]; };
    var card = function () { if (L.screen.view === "screen") L.joinCard({ show: true, size: L.players.length ? "corner" : "full", line: "Scan to wave", avoid: words() }); };
    L.onSettings(paint); L.onPlayers(card); L.store.on(count);
    // a half of a split screen (Lamba.layout): this page has the half's own tall shape, so the words get a little smaller
    var shape = function (l) { document.documentElement.classList.toggle("tall", !!(l && l.tall)); card(); };
    L.onLayout(shape); shape(L.layout);
    var HAND = '<svg class="wave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 11V6a2 2 0 0 0-4 0"/><path d="M14 10V4a2 2 0 0 0-4 0v2"/><path d="M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-6-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg>';
    var wave = function (m, from) {
      var p = L.players.concat(L.visitors || []).filter(function (x) { return x.id === from; })[0], name = p && p.name && L.settings.names ? p.name : "";
      hi.innerHTML = HAND + " " + (name ? "Hello " : "Hello");
      if (name) hi.appendChild(document.createTextNode(name));
      if (L.screen.view === "screen") { L.store.set("waves", (L.store.get("waves") || 0) + 1); count(); if (from && from !== "owner") L.send({ type: "seen" }, from); }
    };
    L.on("wave", wave);
    // the Host's Wave tile (lamba.json actions)
    L.on("action", function (m) { if (m.key === "wave") wave(m, "owner"); });
    paint(); count(); card(); L.drawn();
  });
})();
</script>
</body>
</html>
