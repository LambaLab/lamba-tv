<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Three in a row</title>
<link rel="stylesheet" href="/fonts/css2?family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../shell/sdk/ui.css">
<!--
  Three in a row on a Player's phone (view "guest", the whole phone): a remote with nine keys, low where the thumb rests.
  At the top, your mark and whose turn it is. A press sends { type: "move", cell }; the screen decides and answers with
  { type: "game", g, you }. Once a game is over, Play again. The Host starts a new game with the New game tile in the
  drawer (lamba.json actions), never on a page of its own.
-->
<style>
.l-remote { --l-remote: #14163a; --l-remote-hi: #2c3180; --l-key: #2b2f6b; --l-key-hi: #3a3f8f; --l-key-edge: #0d0f2a; --l-key-ink: #f5f5f7; }
.board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(100%, 52vh, 380px); padding: 14px; box-sizing: border-box; border-radius: 34px;
  background: rgba(0,0,0,.32); box-shadow: 0 3px 10px rgba(0,0,0,.55) inset, 0 1px 0 rgba(255,255,255,.07); }
.board .l-key { aspect-ratio: 1; min-width: 0; min-height: 0; padding: 18%; border-radius: 22px; }
.board .l-key svg { width: 100%; height: 100%; overflow: visible; }
.board .l-key.win { --l-key: #f5f5f7; --l-key-hi: #ffffff; --l-key-edge: #9a9ab0; }
.board .l-key[disabled].mine { filter: none; }
.x path, .o circle { fill: none; stroke-width: 11; stroke-linecap: round; }
.x { stroke: #ffd36e; } .o { stroke: #8fd3ff; }
.win .x { stroke: #c98a00; } .win .o { stroke: #1f7fc0; }
.again { width: 100%; max-width: 380px; margin: 0 auto; min-height: 64px; --l-key: #f5f5f7; --l-key-hi: #fff; --l-key-edge: #9a9ab0; --l-key-ink: #14163a; font-size: 18px; }
.l-remote-foot { min-height: 64px; display: grid; place-items: center; margin-top: 12px; }
</style>
</head>
<body>
<main class="l-remote" id="remote">
  <header class="l-remote-top"><span class="l-remote-who" id="who">You</span><p class="l-remote-say" id="status" role="status">Joining the game</p></header>
  <div class="l-remote-main"><div class="board" id="grid" role="group" aria-label="The board"></div></div>
  <div class="l-remote-foot"><button type="button" class="l-key again" id="again" hidden>Play again</button><span id="hint"></span></div>
</main>
<script src="../../shell/sdk/lamba.js"></script>
<script src="../../shell/sdk/ui.js"></script>
<script>
(function () {
  "use strict";
  var MARK = { x: '<svg class="x" viewBox="0 0 100 100" aria-hidden="true"><path d="M18 18L82 82M82 18L18 82"/></svg>', o: '<svg class="o" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="34"/></svg>' };
  var COLOUR = { x: "#ffd36e", o: "#8fd3ff" };
  var $ = function (id) { return document.getElementById(id); };
  var nameOf = function (g, s) { return (g && g.names && g.names[s]) || (s === "x" ? "X" : "O"); };

  Lamba.ready(function (L) {
    var g = null, you = "", me = L.me();
    $("who").textContent = me ? me.name : "You";
    // the nine keys, made once
    for (var i = 0; i < 9; i++) {
      var b = document.createElement("button"); b.type = "button"; b.className = "l-key"; b.setAttribute("data-c", i); b.setAttribute("aria-label", "Square " + (i + 1));
      (function (b, c) { LambaUI.press(b, function () { L.send({ type: "move", cell: c }); }); })(b, i);
      $("grid").appendChild(b);
    }
    LambaUI.press($("again"), function () { L.send({ type: "again" }); });
    function draw() {
      var ready = g && g.names.x && g.names.o, mine = ready && !g.won && g.turn === you;
      if (you) $("remote").style.setProperty("--l-me", COLOUR[you]);
      $("status").textContent = !g ? "Joining the game"
        : !ready ? "Waiting for a second player"
        : g.won === "draw" ? "A draw"
        : g.won ? (g.won === you ? "You win" : nameOf(g, g.won) + " wins")
        : mine ? "Your turn" : nameOf(g, g.turn) + "'s turn";
      [].forEach.call($("grid").children, function (b, i) {
        var s = g ? g.b.charAt(i) : "-";
        if (b.getAttribute("data-s") !== s) { b.setAttribute("data-s", s); b.innerHTML = s === "-" ? "" : MARK[s]; }
        b.disabled = !mine || s !== "-";
        b.className = "l-key" + (s !== "-" ? " mine" : "") + (g && g.line && g.line.indexOf(i) > -1 ? " win" : "");
      });
      $("again").hidden = !(g && g.won);
      $("hint").textContent = g && g.won ? "" : you ? "You play " + you.toUpperCase() : "";
    }
    L.on("game", function (m) { g = m.g; you = m.you; draw(); });
    draw();
    L.send({ type: "hi" });   // just opened: ask the screen for the game
  });
})();
</script>
</body>
</html>
